name: News bot

on:
  schedule:
    # Каждые 30 минут (в :07 и :37 — в ровные :00 GitHub перегружен и опаздывает).
    # Публичный репозиторий — минуты бесплатны без лимита, можно "*/10 * * * *".
    - cron: "7,37 * * * *"
  workflow_dispatch:          # кнопка ручного запуска

permissions:
  contents: write             # чтобы сохранять state.json в репозиторий

concurrency:
  group: news-bot             # никогда не запускать две копии одновременно
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить библиотеки
        run: pip install -r requirements.txt

      - name: Запустить бота
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          MOD_CHAT_ID: ${{ secrets.MOD_CHAT_ID }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # нет секрета = режим чата
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}               # GLM: отбор новостей и помощник
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }} # GLM запасной

      # Состояние бот сам сохраняет в ветку bot-state (одним коммитом, без истории) — main не растёт.
